version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openlense-backend
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
    volumes:
      - ./backend/experts/uploads:/app/experts/uploads
      - ./backend/upload:/app/upload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openlense-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_VISION_API_URL=http://localhost:8001
      - NEXT_PUBLIC_RAG_API_URL=http://localhost:8002
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
